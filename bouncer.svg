    @keyframes c5 { 0%,66.66% { opacity: 0; } 66.67%,79.99% { opacity: 1; } 80%,100% { opacity: 0; } }
    @keyframes c6 { 0%,79.99% { opacity: 0; } 80%,100% { opacity: 1; } }

    .lbl {
