    @keyframes by { 0% { transform: translateY(0); } 100% { transform: translateY(375px); } }

    .ic { opacity: 0; }
    .i0 { animation: c0 30s infinite; }
    .i1 { animation: c1 30s infinite; }
    .i2 { animation: c2 30s infinite; }
    .i3 { animation: c3 30s infinite; }
    .i4 { animation: c4 30s infinite; }
    .i5 { animation: c5 30s infinite; }
    .i6 { animation: c6 30s infinite; }

    @keyframes c0 { 0%,19.99% { opacity: 1; } 20%,100% { opacity: 0; } }
    @keyframes c1 { 0%,19.99% { opacity: 0; } 20%,33.32% { opacity: 1; } 33.33%,100% { opacity: 0; } }
    @keyframes c2 { 0%,33.32% { opacity: 0; } 33.33%,39.99% { opacity: 1; } 40%,100% { opacity: 0; } }
    @keyframes c3 { 0%,39.99% { opacity: 0; } 40%,59.99% { opacity: 1; } 60%,100% { opacity: 0; } }
